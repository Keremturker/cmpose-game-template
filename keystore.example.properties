# Android release signing (Google Play). Copy this file to keystore.properties (git-ignored) and fill it in.
# BuildScript.BuildAndroid uses it for that build only and leaves ProjectSettings unchanged. Without
# keystore.properties the build is signed with the debug key, which the Play Console rejects.
#
# Create a keystore once and keep it and its passwords safe: without them you cannot update the app.
#   keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000
# (keytool ships with Unity: <Unity editor>/PlaybackEngines/AndroidPlayer/OpenJDK/bin/keytool)
#
# Keystore path, absolute or relative to the project folder
storeFile=release.keystore
storePassword=
keyAlias=release
keyPassword=
